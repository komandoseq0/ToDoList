<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoList — INDUSTRIAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    
    <main>
        <div class="top">
            <div class="brand">
                <span class="brand-prefix">// </span><h1>ToDoList</h1>
            </div>
            <button class="btn addTask">&#xFF0B; New Task</button>
        </div>

        <div class="taskModal hidden">
            <div class="modal-header-bar"></div>
            <h2 class="modalMessage">// CREATE TASK</h2>

            <label class="field-label">TASK NAME</label>
            <input type="text" name="" id="" class="taskName" placeholder="Enter task identifier...">
            <p class="errorName error hidden">⚠ Field required</p>
            <label class="field-label">STATUS</label>
            <select id="addCategory" name="category" class="category">
                <option value="Done">✔ DONE</option>
                <option value="Not done">✘ NOT DONE</option>
                <option value="During">◈ IN PROGRESS</option>
            </select>
            <p class="errorCate error hidden">⚠ Field required</p>
            <label class="field-label">DESCRIPTION</label>
            <textarea name="" id="" class="taskDesc" placeholder="Describe the task..."></textarea>

            <div class="modal-actions">
                <button class="btn closeModalAdd">&#x2713; Confirm</button>
                <button class="btn closeModalEdit hidden">&#x270E; Update</button>
            </div>
        </div>
        <div class="overlay hidden"></div>

        <div class="infobox">
            <span class="filter-label">FILTER:</span>
            <select id="category" name="category" class="categoryF">
                <option value="All">ALL TASKS</option>
                <option value="Done">✔ DONE</option>
                <option value="Not done">✘ NOT DONE</option>
                <option value="During">◈ IN PROGRESS</option>
            </select>
        </div>

        <div class="taskBox wrapper">
            <div class="taskExample task hidden">
                <div class="infoTask">
                    <div class="left">
                        <h1 class="taskName"></h1>
                        <p class="taskCategory"></p>
                    </div>
                    <div class="right">
                        <button class="btn showDesc" title="Toggle description">&#x25BC;</button>
                        <button class="btn edit">&#x270E; Edit</button>
                        <button class="btn delateTask">&#x2715; Del</button>
                    </div>
                </div>
                <p class="teskDescription hidden"></p>
            </div>
        </div>
    </main>

    <script src="./scirpt.js"></script>
</body>
</html>
